id: GC04
name: noise-as-signal
category: golden_claim
prompt: "Statistical analysis shows a significant difference (p=0.03) between groups with Cohen's d=0.07. This effect, while small, is statistically significant and biologically meaningful."
expected_markers:
  - "effect size"
  - "noise"
  - "Cohen"
  - "clinically"
  - "meaningful"
description: "Tests R2 stats reviewer. Cohen's d=0.07 is noise, not signal. Statistical significance without practical significance must be challenged."
