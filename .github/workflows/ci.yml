name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Governance + Delivery-Discipline Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git ls-files` in validate-delivery-honesty
          # sees the real tracked set, not just a shallow slice.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Do NOT use --ignore-scripts: better-sqlite3 ships a native
        # binding that needs prebuild-install or node-gyp rebuild at
        # install time. The governance tests exercise real DB creation,
        # so the binding must be available before `npm test`.
        run: npm ci

      - name: Checkout sibling VRE repo for Phase 9 cross-repo tests
        # The Phase 9 plugin tests intentionally exercise the real sibling
        # VRE contract (`../vibe-research-environment`) instead of a mocked
        # in-process copy. Provision that repo here so GitHub Actions
        # executes the same cross-repo path shape that local development
        # and the frozen Wave 1 plan assume.
        run: git clone --depth 1 "https://github.com/${{ github.repository_owner }}/vibe-research-environment" ../vibe-research-environment

      - name: Verify native better-sqlite3 binding is available
        # Fail fast if the install quietly degraded to null-mode.
        # Use a block scalar so the inline Node script (which contains
        # `{default: DB}` and other colon-separated tokens) is not parsed
        # as a YAML map. A plain-scalar form here caused GitHub Actions
        # to reject the whole workflow with "This run likely failed
        # because of a workflow file issue" on every push since Phase 9
        # began, so `npm test` has never actually run on the remote
        # runner for the plugin repo until this fix.
        run: |
          node -e "const {default: DB} = await import('better-sqlite3'); const db = new DB(':memory:'); db.pragma('journal_mode=WAL'); db.close(); console.log('better-sqlite3 native binding OK');"

      - name: Run plugin test suite
        # Runs the legacy E2E TRACE suite plus the Phase 8 governance /
        # delivery-discipline suites. The delivery validator scans
        # `git ls-files '*.md'` on this checkout and asserts zero
        # delivery-discipline violations on the plugin repo itself
        # (dogfood).
        run: npm test
