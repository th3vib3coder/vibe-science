name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Governance + Delivery-Discipline Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git ls-files` in validate-delivery-honesty
          # sees the real tracked set, not just a shallow slice.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Do NOT use --ignore-scripts: better-sqlite3 ships a native
        # binding that needs prebuild-install or node-gyp rebuild at
        # install time. The governance tests exercise real DB creation,
        # so the binding must be available before `npm test`.
        run: npm ci

      - name: Verify native better-sqlite3 binding is available
        # Fail fast if the install quietly degraded to null-mode.
        run: node -e "const {default: DB} = await import('better-sqlite3'); const db = new DB(':memory:'); db.pragma('journal_mode=WAL'); db.close(); console.log('better-sqlite3 native binding OK');"

      - name: Run plugin test suite
        # Runs the legacy E2E TRACE suite plus the Phase 8 governance /
        # delivery-discipline suites. The delivery validator scans
        # `git ls-files '*.md'` on this checkout and asserts zero
        # delivery-discipline violations on the plugin repo itself
        # (dogfood).
        run: npm test
