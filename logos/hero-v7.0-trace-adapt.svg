<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Science v7.0 TRACE plus TRACE+ADAPT V0</title>
  <desc id="desc">GitHub landing hero explaining Vibe Science as an integrity-first research runtime for Claude Code, combining methodology, runtime enforcement, and deterministic harness adaptation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="55%" stop-color="#0d1729"/>
      <stop offset="100%" stop-color="#111c31"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.18" r="0.8">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.12" r="0.7">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.72" cy="0.82" r="0.75">
      <stop offset="0%" stop-color="#f2cc60" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f2cc60" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#41506a"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="48%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#f2cc60"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#glowA)"/>
  <rect width="1200" height="720" fill="url(#glowB)"/>
  <rect width="1200" height="720" fill="url(#glowC)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>

  <g opacity="0.55">
    <circle cx="74" cy="58" r="2" fill="#f2cc60"/>
    <circle cx="188" cy="92" r="1.5" fill="#f2cc60"/>
    <circle cx="302" cy="44" r="1.6" fill="#f2cc60"/>
    <circle cx="1098" cy="88" r="1.6" fill="#f2cc60"/>
    <circle cx="1030" cy="54" r="2.1" fill="#f2cc60"/>
    <circle cx="1128" cy="130" r="1.4" fill="#f2cc60"/>
    <circle cx="1015" cy="658" r="1.7" fill="#f2cc60"/>
    <circle cx="1170" cy="612" r="1.4" fill="#f2cc60"/>
  </g>

  <g transform="translate(72 64)">
    <rect x="0" y="0" width="136" height="30" rx="15" fill="#13283f" stroke="#2ea043" stroke-width="1.2"/>
    <text x="68" y="20" text-anchor="middle" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#7ee787">v7.0 TRACE</text>

    <rect x="150" y="0" width="176" height="30" rx="15" fill="#17243c" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="238" y="20" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14" font-weight="700" fill="#79c0ff">TRACE+ADAPT V0</text>

    <text x="0" y="110" font-family="'Aptos Display', 'Segoe UI Variable', 'Trebuchet MS', sans-serif" font-size="78" font-weight="800" letter-spacing="5" fill="#f6f8fa">VIBE</text>
    <text x="0" y="182" font-family="'Aptos Display', 'Segoe UI Variable', 'Trebuchet MS', sans-serif" font-size="78" font-weight="800" letter-spacing="5" fill="#7ee787">SCIENCE</text>

    <text x="0" y="236" font-family="'Palatino Linotype', Georgia, serif" font-size="30" fill="#dce6f5">Integrity-first research runtime for Claude Code</text>

    <text x="0" y="286" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="21" fill="#b6c2d1">
      Plugin-enforced scientific workflow with adversarial review,
    </text>
    <text x="0" y="316" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="21" fill="#b6c2d1">
      persistent evidence trails, cross-session state, and deterministic adaptation.
    </text>

    <g transform="translate(0 372)">
      <circle cx="10" cy="8" r="5" fill="#7ee787"/>
      <text x="28" y="14" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">Plugin + skill + audit trail, not just a prompt pack</text>
      <circle cx="10" cy="46" r="5" fill="#79c0ff"/>
      <text x="28" y="52" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">Real gates for citations, promotion, stop-time review, and SSOT discipline</text>
      <circle cx="10" cy="84" r="5" fill="#f2cc60"/>
      <text x="28" y="90" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">Adaptive harness, not adaptive truth</text>
    </g>

    <rect x="0" y="528" width="476" height="92" rx="20" fill="#101a2b" stroke="url(#panelStroke)" stroke-width="1.2"/>
    <text x="26" y="562" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" font-weight="700" fill="#79c0ff">WHAT CHANGED BY MARCH 26, 2026</text>
    <text x="26" y="592" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#dce6f5">
      TRACE closes the runtime loop.
    </text>
    <text x="26" y="616" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#dce6f5">
      TRACE+ADAPT adds SessionStart carry-over hints from recurring failures.
    </text>
  </g>

  <g transform="translate(640 74)" filter="url(#softShadow)">
    <rect x="0" y="0" width="494" height="572" rx="28" fill="#0f1726" fill-opacity="0.92" stroke="url(#panelStroke)" stroke-width="1.4"/>

    <text x="36" y="52" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#8b9db7" letter-spacing="2">WHAT THE PLUGIN BECAME</text>
    <text x="36" y="92" font-family="'Aptos Display', 'Segoe UI Variable', 'Trebuchet MS', sans-serif" font-size="34" font-weight="760" fill="#f6f8fa">Methodology, runtime enforcement,</text>
    <text x="36" y="132" font-family="'Aptos Display', 'Segoe UI Variable', 'Trebuchet MS', sans-serif" font-size="34" font-weight="760" fill="#f6f8fa">and adaptive carry-over in one loop.</text>

    <g transform="translate(36 178)">
      <rect x="0" y="0" width="422" height="108" rx="22" fill="#11241b" stroke="#2ea043" stroke-width="1.2"/>
      <text x="24" y="30" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="15" font-weight="700" fill="#7ee787">1. METHODOLOGY BRAIN</text>
      <text x="24" y="58" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">OTAE loop, Reviewer 2, SFI, confounder discipline,</text>
      <text x="24" y="82" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">tree search, literature protocols, and research law.</text>
    </g>

    <g transform="translate(36 306)">
      <rect x="0" y="0" width="422" height="108" rx="22" fill="#101f34" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="24" y="30" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="15" font-weight="700" fill="#79c0ff">2. TRACE RUNTIME</text>
      <text x="24" y="58" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">7 hooks, SQLite state, citation verification, DQ4,</text>
      <text x="24" y="82" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">L-1+, L0, D1, stop-time review blocking, observer alerts.</text>
    </g>

    <g transform="translate(36 434)">
      <rect x="0" y="0" width="422" height="108" rx="22" fill="#2a210f" stroke="#f2cc60" stroke-width="1.2"/>
      <text x="24" y="30" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="15" font-weight="700" fill="#f2cc60">3. TRACE+ADAPT V0</text>
      <text x="24" y="58" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">Pattern extraction and observer history become short,</text>
      <text x="24" y="82" font-family="'Aptos', 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="18" fill="#f0f6fc">deterministic SessionStart hints with cooldowns.</text>
    </g>

    <line x1="248" y1="286" x2="248" y2="304" stroke="#2ea043" stroke-width="4" stroke-linecap="round"/>
    <line x1="248" y1="414" x2="248" y2="432" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>

    <rect x="36" y="520" width="422" height="24" rx="12" fill="#0d1522" stroke="#253247" stroke-width="1"/>
    <rect x="44" y="526" width="126" height="12" rx="6" fill="#2ea043"/>
    <rect x="170" y="526" width="176" height="12" rx="6" fill="#58a6ff"/>
    <rect x="346" y="526" width="104" height="12" rx="6" fill="#f2cc60"/>
  </g>

  <g transform="translate(72 676)">
    <line x1="0" y1="0" x2="1056" y2="0" stroke="#233044" stroke-width="1"/>
    <text x="0" y="24" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14" fill="#8b9db7">7 lifecycle hooks · deterministic hook logic · 169/169 tests · smoke + readiness passing</text>
    <text x="1056" y="24" text-anchor="end" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14" font-weight="700" fill="#79c0ff">HARDER TO RUSH · HARDER TO FAKE · EASIER TO AUDIT</text>
  </g>
</svg>
